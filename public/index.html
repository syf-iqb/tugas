<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD Produk</title>
  <!-- Link Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  
  <div class="container mt-4">
    <h1 class="mb-0">Toko Serba Tidak Ada</h1>
    <h2 class="h5 text-muted mb-4">Data Produk</h2>
    
    <!-- Form Simpel (Inline) -->
    <form id="formProduk" class="row g-2 mb-4">
      <div class="col-sm-auto">
        <input type="text" id="kode_produk" class="form-control" placeholder="Kode Produk" required>
      </div>
      <div class="col-sm-auto">
        <input type="text" id="nama_produk" class="form-control" placeholder="Nama Produk" required>
      </div>
      <div class="col-sm-auto">
        <input type="number" id="harga" class="form-control" placeholder="Harga" required>
      </div>
      <div class="col-sm-auto">
        <input type="number" id="stok" class="form-control" placeholder="Stok" required>
      </div>
      <div class="col-sm-auto">
        <button type="submit" id="btnSimpan" class="btn btn-primary">Simpan</button>
        <button type="button" id="btnBatal" class="btn btn-light border">Batal</button>
      </div>
    </form>

    <!-- Tabel dengan Contoh Dataset -->
    <table class="table table-bordered table-striped">
      <thead class="table-light">
        <tr>
          <th>Kode Produk</th>
          <th>Nama Produk</th>
          <th>Harga</th>
          <th>Stok</th>
          <th width="150" class="text-center">Aksi</th>
        </tr>
      </thead>
      <tbody id="dataProduk">
        
        <!-- Baris Dataset 1 -->
        <tr>
          <td>PRD-001</td>
          <td>Sapu Lidi Kipas</td>
          <td>15000</td>
          <td>35</td>
          <td class="text-center">
            <button class="btn btn-sm btn-warning">Edit</button>
            <button class="btn btn-sm btn-danger">Hapus</button>
          </td>
        </tr>
        
        <!-- Baris Dataset 2 -->
        <tr>
          <td>PRD-002</td>
          <td>Ember Plastik Hitam</td>
          <td>25000</td>
          <td>12</td>
          <td class="text-center">
            <button class="btn btn-sm btn-warning">Edit</button>
            <button class="btn btn-sm btn-danger">Hapus</button>
          </td>
        </tr>

        <!-- Baris Dataset 3 -->
        <tr>
          <td>PRD-003</td>
          <td>Kemoceng Bulu</td>
          <td>12500</td>
          <td>50</td>
          <td class="text-center">
            <button class="btn btn-sm btn-warning">Edit</button>
            <button class="btn btn-sm btn-danger">Hapus</button>
          </td>
        </tr>

      </tbody>
    </table>

    <p id="pesan" class="text-success fw-bold"></p>
  </div>

  <script src="tes1.js"></script>
</body>
</html>
